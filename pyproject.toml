[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-reliability-lab"
version = "0.1.0"
description = "Experimental framework for evaluating RAG retrieval and LLM reliability"
requires-python = ">=3.10"

dependencies = [
    # PDF ingestion
    "pymupdf>=1.24,<2",

    # Numerical operations
    "numpy>=1.26,<3",

    # Sparse retrieval (BM25)
    "rank-bm25>=0.2.2,<1",

    # Dense retrieval and Cross-Encoder reranking
    "sentence-transformers>=3,<6",

    # Evaluation visualizations
    "matplotlib>=3.8,<4",

    # Local LLM integration
    "ollama>=0.4,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
reliability-lab = "reliability_lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]